
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>

  <script>
    // GitHub Pages SPA fallback
    (function () {
      var base = '/cutemagic-website';

      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      var route = path.startsWith(base)
        ? path.slice(base.length)
        : path;

      // Chuyển đường dẫn thành query để index.html khôi phục
      var redirect = base + '/?/' +
        route.replace(/^\//, '') +
        search +
        hash;

      window.location.replace(redirect);
    })();
  </script>
</head>
<body>
  <p>Redirecting to CuteMagic Website...</p>
</body>
</html>
