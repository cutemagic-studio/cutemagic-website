<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:,">
    <title>CuteMagic</title>

    <!-- Khôi phục đường dẫn SPA từ 404.html trước khi Vue Router khởi chạy -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');

          var base = '/cutemagic-website';
          window.history.replaceState(
            null,
            null,
            base + decoded + l.hash
          );
        }
      })(window.location);
    </script>

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
