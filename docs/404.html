<!-- public/404.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Magic Studio</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #94a3b8;
      font-family: sans-serif;
      margin: 0;
    }
  </style>
  <script>
    // GitHub Pages SPA Fallback (Chuẩn hóa cả Path, Query Search & Hash)
    (function () {
      var base = '/cutemagic-website';
      var l = window.location;

      var route = l.pathname.startsWith(base)
        ? l.pathname.slice(base.length)
        : l.pathname;

      // Chuyển dấu '?' đầu tiên của search thành '&' và các dấu '&' thành '~and~'
      var encodedSearch = l.search
        ? '&' + l.search.slice(1).replace(/&/g, '~and~')
        : '';

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        base + '/?/' +
        route.replace(/^\//, '').replace(/&/g, '~and~') +
        encodedSearch +
        l.hash;

      l.replace(redirectUrl);
    })();
  </script>
</head>
<body>
</body>
</html>
